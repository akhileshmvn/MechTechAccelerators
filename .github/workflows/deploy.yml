name: Build and Deploy to S3

on:
  push:
    branches:
      - main   # runs whenever you push to main branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: mechtechaccelerators.com

    steps:
      # Step 1: Get your code
      - name: Checkout repo
        uses: actions/checkout@v5

      # Step 2: Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Step 2.5: Prefer short-lived AWS credentials via GitHub OIDC
      - name: Configure AWS credentials with OIDC
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Fallback for repos that still use static IAM user keys
      - name: Configure AWS credentials with access keys
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build Vite project
      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # Step 5: Upload dist/ to S3 using the configured AWS credentials
      - name: Deploy to S3
        run: aws s3 sync dist/public "s3://${AWS_S3_BUCKET}" --delete
