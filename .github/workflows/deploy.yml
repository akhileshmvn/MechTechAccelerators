name: Build and Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify AWS_ROLE_TO_ASSUME secret exists
        env:
          ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -z "$ROLE_TO_ASSUME" ]; then
            echo "ERROR: Repository secret AWS_ROLE_TO_ASSUME is not set."
            echo "Set it to the role ARN (arn:aws:iam::123456789012:role/YourRoleName)."
            exit 1
          fi
          if ! echo "$ROLE_TO_ASSUME" | grep -E '^arn:aws:iam::[0-9]{12}:role\/' >/dev/null; then
            echo "WARNING: AWS_ROLE_TO_ASSUME doesn't look like a role ARN: $ROLE_TO_ASSUME"
            echo "Workflow will continue, but verify the value is correct."
          fi

      - name: Configure AWS credentials (OIDC assume-role)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Sync S3
        uses: aws-actions/amazon-s3-sync-action@v1
        with:
          source-dir: 'dist/public'
          destination: 's3://mechtechaccelerators.com'
          delete: true
